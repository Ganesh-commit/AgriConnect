version: '3.9'

services:
  mongo:
    image: mongo:7
    container_name: agriconnect-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: agriconnect-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env.example
    environment:
      - MONGO_URI=mongodb://mongo:27017/agriconnect
      - CLIENT_URL=http://localhost:5173
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    depends_on:
      - mongo

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: agriconnect-client
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:5000/api
      - VITE_SOCKET_URL=http://localhost:5000
    depends_on:
      - server

volumes:
  mongo_data:

